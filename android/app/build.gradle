apply plugin: 'com.android.application'

// La firma vive en firma.properties, fuera de git. Si el archivo no está, la
// compilación de release sigue adelante sin firmar en vez de romperse: así el
// proyecto compila en una máquina que no tenga el almacén.
def firma = new Properties()
def archivoFirma = rootProject.file("firma.properties")
if (archivoFirma.exists()) {
    firma.load(new FileInputStream(archivoFirma))
}

android {
    namespace = "app.genuino.firme"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.genuino.firme"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 51
        versionName "6.9"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!*.apk:!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (archivoFirma.exists()) {
                storeFile rootProject.file(firma['almacen'])
                storePassword firma['clave']
                keyAlias firma['alias']
                keyPassword firma['clave']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (archivoFirma.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // ------------------------------------------------- las salas de voz
    //
    // El SDK de **voz** de Agora, no el completo: aqui no hay video, y el
    // completo pesa cuatro veces mas por codecs que no se usan.
    //
    // La version esta elegida MIDIENDO, no cogiendo la ultima (24-09-2026):
    //
    //   4.5.2.135        28,5 MB   <- esta
    //   4.5.3.4.1        68,7 MB
    //   4.6.3.1          72,3 MB
    //
    // A partir de 4.5.3 las compilaciones normales empaquetan los modelos de
    // supresion de ruido por IA y **triplican el tamano**. Actualizar a ciegas
    // llevaria la app de unos 12 MB por movil a unos 23. Si algun dia hace
    // falta subir, medir primero y mirar las variantes `.BASIC` (27,2 MB).
    //
    // El .aar trae las cuatro arquitecturas. En un .aab cada movil se descarga
    // solo la suya, asi que al usuario le llegan unos 7 MB de esto, no 28.
    implementation 'io.agora.rtc:agora-special-voice:4.5.2.135'

}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
